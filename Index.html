<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:#f7f5fb;color:#302940;font:16px system-ui,sans-serif}
main{max-width:480px;margin:24px auto;padding:22px}h1{font-size:32px;margin:0 0 18px;color:#584674}
form{background:white;border:1px solid #ddd6e7;border-radius:20px;padding:20px}
label{display:block;font-weight:600;margin:14px 0 5px}label:first-child{margin-top:0}
input,select,button{width:100%;padding:11px;border-radius:10px;border:1px solid #cfc8d8;font:inherit;color:inherit;background:white}
#amount{font-size:28px;background:#f5f0fc}#category{background:#fbeaf1}#account{background:#eaf3ff}
button{margin-top:18px;background:#635081;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.65}
output{display:block;margin-top:10px}output:empty{display:none}
</style></head><body><main><h1>Quick add</h1><form id="entry">
<label for="amount">Amount · RM</label><input id="amount" name="amount" type="number" step=".01" min=".01" max="999999999" inputmode="decimal" placeholder="0.00" required>
<label for="category">Category</label><select id="category" name="category"></select>
<label for="account">Account</label><select name="account" id="account"><option>Cash</option><option>Bank</option><option>TNG</option></select>
<label for="type">Type</label><select name="type" id="type"><option>Expense</option><option>Income</option></select>
<label for="date">Date</label><input id="date" name="date" type="date" value="<?= today ?>" required>
<label for="item">Item <small>(optional)</small></label><input name="item" id="item" maxlength="160" placeholder="e.g. Lunch at work">
<button id="save">Save entry</button><output role="status" id="status"></output></form></main>
<script>
const options = <?!= options ?>;
const form = document.querySelector('#entry');
const fields = form.elements;
let requestId = crypto.randomUUID();
function showCategories() {
  fields.category.replaceChildren(...options[fields.type.value].map(name => new Option(name,name)));
}
showCategories();
fields.type.onchange = showCategories;
form.onsubmit = event => {
  event.preventDefault();
  const data = Object.fromEntries(new FormData(form));
  data.id = requestId;
  fields.save.disabled = true;
  fields.status.value = 'Saving…';
  google.script.run.withSuccessHandler(() => {
    requestId = crypto.randomUUID();
    fields.status.value = 'Saved · RM' + Number(data.amount).toFixed(2) + ' · ' + data.category;
    fields.amount.value = '';
    fields.item.value = '';
    fields.save.disabled = false;
  }).withFailureHandler(error => {
    fields.status.value = error.message;
    fields.save.disabled = false;
  }).saveEntry(data);
};
</script></body></html>
